<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Department week · Workforce Operations</title>
    <link rel="icon" type="image/png" href="/images/logos/app-square.png" />
    <link rel="stylesheet" href="/css/base/base.css" />
    <link rel="stylesheet" href="/css/components/app-shell.css" />
    <link rel="stylesheet" href="/css/components/shift-card.css" />
    <link rel="stylesheet" href="/css/components/day-list.css" />
    <link rel="stylesheet" href="/css/components/form.css" />
    <link rel="stylesheet" href="/css/components/shift-dialog.css" />
    <link rel="stylesheet" href="/css/components/stat-tile.css" />
    <link rel="stylesheet" href="/css/components/week-grid.css" />
    <link rel="stylesheet" href="/css/components/week-sections.css" />
    <link rel="stylesheet" href="/css/components/week-nav.css" />
    <link rel="stylesheet" href="/css/pages/schedule.css" />
    <script type="module" src="/js/pages/schedule.js"></script>
  </head>
  <body>
    <!-- The app shell: the brand, the main tabs, then who is signed in. The logo spot
         shows the application's logo until the session loads, then the company's logo if
         it has one; the image has empty alt text because the name next to it is the
         link's text, so the link is never unnamed. Each tab names the permission it needs (data-permission) and starts
         hidden; js/components/app-shell.js shows the ones the person may use. -->
    <div class="app-shell-top">
      <header class="app-header">
        <a class="brand" href="/pages/my-shifts.html">
          <span class="brand__logo" aria-hidden="true">
            <img src="/images/logos/app-square.png" alt="" width="40" height="40" />
          </span>
          <span class="brand__name">Workforce Operations</span>
        </a>
      </header>
      <nav class="tab-bar" aria-label="Main">
        <a
          class="tab-bar__link"
          href="/pages/my-shifts.html"
          data-permission="schedule.view_self"
          hidden
        >
          <span class="icon icon--calendar" aria-hidden="true"></span>
          My week
        </a>
        <a
          class="tab-bar__link"
          href="/pages/schedule.html"
          aria-current="page"
          data-permission="schedule.view"
          hidden
        >
          <span class="icon icon--people" aria-hidden="true"></span>
          Department
        </a>
      </nav>
      <!-- The signed-in person's name and the sign-out button, filled in by the script. -->
      <div id="account" class="account" hidden></div>
    </div>
    <!-- Shown while the session loads, in the place where the page will appear. It says
         nothing about the page, so a signed-out visitor on the way to sign in sees only this. -->
    <p id="page-loading" class="page-loading" role="status">Loading…</p>
    <!-- The page itself starts hidden too, so a signed-out visitor never sees it, not even
         for a moment before going to the sign-in page. startSignedInPage shows it once the
         session has loaded (or the server could not be asked, so the page can say so). -->
    <main class="app-main schedule" hidden>
      <!-- Page heading and week choice on one line on a laptop, stacked on a phone. -->
      <div class="page-head">
        <div>
          <p class="eyebrow">Department week</p>
          <h1 id="title">Department week</h1>
        </div>
        <nav class="week-nav" aria-label="Weeks">
          <a id="previous-week" class="week-nav__button" href="?">
            <span class="icon icon--chevron-left" aria-hidden="true"></span>
            Previous
          </a>
          <span id="week-range" class="week-nav__range"></span>
          <a id="next-week" class="week-nav__button" href="?">
            Next
            <span class="icon icon--chevron-right" aria-hidden="true"></span>
          </a>
          <a
            id="current-week"
            class="week-nav__button week-nav__current"
            role="link"
            aria-disabled="true"
          >
            Back to current week
          </a>
        </nav>
      </div>
      <p id="status" class="status" aria-live="polite">Loading the week…</p>
      <!-- The week itself, dimmed while another week loads (css/components/week-nav.css). -->
      <div class="week-content">
        <!-- The week's numbers: shifts, open shifts, hours, people. -->
        <section id="stats" class="stats" aria-label="This week in numbers" hidden></section>
        <!-- The same week twice: a grid for laptops, a card per day for phones. The
             stylesheet shows only one of them; the hidden one is skipped by screen readers
             too. -->
        <div id="grid" class="week-grid-card"></div>
        <div id="days" class="days days--week"></div>
        <!-- Under the week: open shifts (laptops only; phones see them in the day cards)
             and the people without a shift this week. -->
        <div id="sections"></div>
      </div>
    </main>
  </body>
</html>
