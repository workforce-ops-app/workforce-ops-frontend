<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · Workforce Operations</title>
    <link rel="stylesheet" href="/css/base/base.css" />
    <link rel="stylesheet" href="/css/components/app-shell.css" />
    <link rel="stylesheet" href="/css/components/form.css" />
    <link rel="stylesheet" href="/css/pages/sign-in.css" />
    <script type="module" src="/js/pages/sign-in.js"></script>
  </head>
  <body>
    <!-- No tab bar here: nobody is signed in yet, so there is nowhere else to go. -->
    <main class="sign-in">
      <p class="brand sign-in__brand">
        <span class="brand__logo" aria-hidden="true"></span>
        <span class="brand__name">Workforce Operations</span>
      </p>

      <section class="sign-in__card" aria-labelledby="sign-in-title">
        <h1 id="sign-in-title">Sign in</h1>
        <p class="muted sign-in__intro">Use the email address your workplace gave you.</p>

        <!-- method="post": if the script ever fails to load and the browser sends the form
             itself, the password travels in the request body. With the default (GET) it
             would land in the address bar, the browser history, and server logs. -->
        <form id="sign-in-form" class="form" method="post" novalidate>
          <div class="field">
            <label class="field__label" for="email">Email</label>
            <!-- autocomplete="username" and "current-password" let password managers fill
                 the form; pasting stays allowed, so long generated passwords work. -->
            <input
              id="email"
              class="field__input"
              name="email"
              type="email"
              autocomplete="username"
              required
            />
          </div>
          <div class="field">
            <label class="field__label" for="password">Password</label>
            <input
              id="password"
              class="field__input"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <!-- One message for every failure, so the page never says whether an email
               exists (filled in by the script, read out by screen readers). -->
          <p id="sign-in-message" class="form__message" role="alert" hidden></p>
          <button class="button button--primary button--wide" type="submit">Sign in</button>
        </form>
      </section>

      <p id="api-status" class="sign-in__status muted" aria-live="polite">Checking the server…</p>
    </main>
  </body>
</html>
