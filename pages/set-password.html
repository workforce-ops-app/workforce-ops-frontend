<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Set your password · Workforce Operations</title>
    <link rel="icon" type="image/png" href="/images/logos/app-square.png" />
    <link rel="stylesheet" href="/css/base/base.css" />
    <link rel="stylesheet" href="/css/components/app-shell.css" />
    <link rel="stylesheet" href="/css/components/form.css" />
    <link rel="stylesheet" href="/css/pages/sign-in.css" />
    <script type="module" src="/js/pages/set-password.js"></script>
  </head>
  <body>
    <!-- Nobody is signed in here: the link is the proof. Same frame as the sign-in page. -->
    <main class="sign-in">
      <p class="sign-in__brand">
        <img class="sign-in__logo" src="/images/logos/app.png" alt="" width="640" height="289" />
        <span class="brand__name">Workforce Operations</span>
      </p>

      <section class="sign-in__card" aria-labelledby="set-password-title">
        <h1 id="set-password-title">Set your password</h1>
        <p id="set-password-intro" class="muted sign-in__intro">
          Choose the password you will sign in with.
        </p>

        <!-- method="post" and novalidate as on the sign-in page: the script checks the
             fields and sends them; without the script, nothing would reach an address. -->
        <form id="set-password-form" class="form" method="post" novalidate>
          <div class="field">
            <label class="field__label" for="new-password">New password</label>
            <!-- new-password: password managers offer to make and save a strong one;
                 pasting is allowed, so long generated passwords work. -->
            <input
              id="new-password"
              class="field__input"
              name="new-password"
              type="password"
              autocomplete="new-password"
              aria-describedby="password-rules"
              required
            />
            <span id="password-rules" class="field__hint"></span>
          </div>
          <div class="field">
            <label class="field__label" for="repeat-password">New password again</label>
            <input
              id="repeat-password"
              class="field__input"
              name="repeat-password"
              type="password"
              autocomplete="new-password"
              required
            />
          </div>
          <p id="set-password-message" class="form__message" role="alert" hidden></p>
          <button class="button button--primary button--wide" type="submit">Set password</button>
        </form>

        <!-- Shown instead of the form once the password is set. -->
        <p id="set-password-done" hidden>
          Your password is set.
          <a href="/pages/sign-in.html">Sign in</a>
        </p>
      </section>
    </main>
  </body>
</html>
