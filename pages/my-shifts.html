<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>My week · Workforce Operations</title>
    <link rel="stylesheet" href="/css/base/base.css" />
    <link rel="stylesheet" href="/css/components/app-shell.css" />
    <link rel="stylesheet" href="/css/components/shift-card.css" />
    <link rel="stylesheet" href="/css/components/day-list.css" />
    <script type="module" src="/js/pages/my-shifts.js"></script>
  </head>
  <body>
    <!-- The app shell: the brand, then the main tabs. The logo spot is empty until a logo
         is chosen; the name next to it is the link's text, so it is never unnamed. -->
    <div class="app-shell-top">
      <header class="app-header">
        <a class="brand" href="/pages/my-shifts.html">
          <span class="brand__logo" aria-hidden="true"></span>
          <span class="brand__name">Workforce Operations</span>
        </a>
      </header>
      <nav class="tab-bar" aria-label="Main">
        <a class="tab-bar__link" href="/pages/my-shifts.html" aria-current="page">
          <span class="icon icon--calendar" aria-hidden="true"></span>
          My week
        </a>
        <a class="tab-bar__link" href="/pages/schedule.html">
          <span class="icon icon--people" aria-hidden="true"></span>
          Department
        </a>
      </nav>
    </div>
    <main class="app-main">
      <h1>My week</h1>
      <nav class="week-nav" aria-label="Weeks">
        <a id="previous-week" class="week-nav__button" href="?">
          <span class="icon icon--chevron-left" aria-hidden="true"></span>
          Previous
        </a>
        <span id="week-range" class="week-nav__range"></span>
        <a id="next-week" class="week-nav__button" href="?">
          Next
          <span class="icon icon--chevron-right" aria-hidden="true"></span>
        </a>
      </nav>
      <p id="status" class="status" aria-live="polite">Loading your shifts…</p>
      <div id="days" class="days"></div>
      <div id="summary" class="summary-card" hidden></div>
    </main>
  </body>
</html>
