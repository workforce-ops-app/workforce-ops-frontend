# Weekly dependency update PRs. Minor/patch updates are grouped per ecosystem;
# major updates arrive one per PR. See the dependencies guide and decision 0011.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["type:chore", "area:deps"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node.js types stay on 24 until a decision record changes the Node.js version (0033).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["type:chore", "area:deps"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["type:chore", "area:deps"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
