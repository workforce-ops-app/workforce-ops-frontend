# A deliberately tiny API used only by the frontend smoke test. It proves that nginx
# forwards /api without making frontend CI clone and start the separate backend repo.
server {
    listen 8000;

    location = /api/health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Nobody is ever signed in to this stub: "who am I" always answers 401, as the real
    # API does without a session cookie, so the smoke test can check the redirect.
    location = /api/sessions/current {
        default_type application/problem+json;
        return 401 '{"type":"about:blank","title":"Unauthorized","status":401}';
    }

    # Phase 2 will create the real session cookie. This response lets each Playwright
    # browser engine check whether localhost accepts the required __Host- attributes.
    location = /api/localhost-cookie-check {
        add_header Set-Cookie "__Host-localhost-check=accepted; Path=/; Secure; HttpOnly; SameSite=Strict";
        default_type application/json;
        return 200 '{"status":"set"}';
    }
}
