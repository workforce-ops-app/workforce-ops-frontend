# nginx runs entirely as the non-root user selected in the Dockerfile. Paths that
# normally live under /var/run or /var/cache therefore point at writable /tmp.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr notice;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;

    # Browsers honor HSTS only over HTTPS. Local development has an empty value (and
    # nginx omits empty headers); an HTTPS listener automatically gets the policy.
    map $scheme $strict_transport_security {
        default "";
        https "max-age=31536000; includeSubDomains";
    }

    server {
        # Port 8080 does not require root privileges inside the container.
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;

        # These headers apply to successful and error responses. The policy permits
        # this origin's files and API calls, but no inline scripts or styles.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Strict-Transport-Security $strict_transport_security always;

        # The placeholder is currently the sign-in page. Using a redirect keeps its
        # final URL explicit, so later relative links behave like every other page.
        location = / {
            return 302 /pages/sign-in.html;
        }

        # No path is supplied on proxy_pass, so nginx preserves the complete /api/*
        # path expected by FastAPI. "api" is the backend's Compose service name on
        # the shared workforce-ops network.
        location /api/ {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static requests must name a real file; nginx never falls back to arbitrary
        # HTML because this project is a multi-page application, not an SPA.
        location / {
            try_files $uri =404;
        }
    }
}
